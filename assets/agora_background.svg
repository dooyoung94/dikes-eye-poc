<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e7"/>
      <stop offset="0.55" stop-color="#eadfcd"/>
      <stop offset="1" stop-color="#d8c8ae"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="18%" r="55%">
      <stop offset="0" stop-color="#fffaf1" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#f6ead5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#d7c4a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c7aa"/>
      <stop offset="0.5" stop-color="#bda98a"/>
      <stop offset="1" stop-color="#9d896c"/>
    </linearGradient>
    <linearGradient id="stoneLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee4d4"/>
      <stop offset="1" stop-color="#bda98a"/>
    </linearGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
    <pattern id="marble" width="240" height="190" patternUnits="userSpaceOnUse">
      <path d="M-20 70 C35 42,75 92,128 61 S214 54,278 20" fill="none" stroke="#ab9778" stroke-opacity=".17" stroke-width="2"/>
      <path d="M10 168 C66 130,100 181,154 146 S214 127,260 105" fill="none" stroke="#8e7a5d" stroke-opacity=".10" stroke-width="1.5"/>
      <path d="M55 -12 C82 31,106 45,133 82 S189 143,225 207" fill="none" stroke="#cab99e" stroke-opacity=".18" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <rect width="1600" height="1000" fill="url(#marble)" opacity=".7"/>

  <!-- distant city -->
  <g opacity=".52" filter="url(#blur)" fill="#bba98c" stroke="#9f8a6b" stroke-width="2">
    <path d="M60 350h210v-74h-30v-70h-38v70h-34v-104h-42v104H93v-55H60z"/>
    <path d="M1325 332h215v-88h-34v-92h-42v92h-32v-62h-38v62h-36v-43h-33z"/>
    <path d="M280 308h225v-58l112-58 110 58v58z"/>
    <path d="M875 295h250v-72l124-67 124 67v72z"/>
  </g>

  <!-- left colonnade -->
  <g opacity=".78" stroke="#8f7a5c" stroke-width="3">
    <path d="M0 140h170l-22 42H22z" fill="#d8c7a9"/>
    <rect x="18" y="182" width="126" height="28" rx="5" fill="#bba688"/>
    <path d="M36 210h92v420H36z" fill="url(#stoneLight)"/>
    <path d="M48 210v420M64 210v420M80 210v420M96 210v420M112 210v420" opacity=".35"/>
    <path d="M20 630h128l24 36H0z" fill="#b9a486"/>
    <path d="M128 265h128v28H128zM139 293h106v286H139zM126 579h134v32H126z" fill="url(#stoneLight)" opacity=".72"/>
  </g>

  <!-- right colonnade -->
  <g opacity=".78" stroke="#8f7a5c" stroke-width="3">
    <path d="M1430 140h170v42h-148z" fill="#d8c7a9"/>
    <rect x="1452" y="182" width="126" height="28" rx="5" fill="#bba688"/>
    <path d="M1470 210h92v420h-92z" fill="url(#stoneLight)"/>
    <path d="M1482 210v420M1498 210v420M1514 210v420M1530 210v420M1546 210v420" opacity=".35"/>
    <path d="M1452 630h128l20 36h-172z" fill="#b9a486"/>
    <path d="M1344 265h128v28h-128zM1355 293h106v286h-106zM1340 579h134v32h-134z" fill="url(#stoneLight)" opacity=".72"/>
  </g>

  <!-- temples -->
  <g fill="#d6c4a7" stroke="#9c8666" stroke-width="3" opacity=".72">
    <path d="M220 420h275v-24l-138-75-137 75z"/>
    <rect x="238" y="420" width="239" height="26"/>
    <rect x="254" y="446" width="24" height="155"/>
    <rect x="302" y="446" width="24" height="155"/>
    <rect x="350" y="446" width="24" height="155"/>
    <rect x="398" y="446" width="24" height="155"/>
    <rect x="446" y="446" width="24" height="155"/>
    <path d="M210 601h295v30H210z"/>

    <path d="M1105 403h285v-24l-143-77-142 77z"/>
    <rect x="1120" y="403" width="255" height="26"/>
    <rect x="1137" y="429" width="24" height="170"/>
    <rect x="1187" y="429" width="24" height="170"/>
    <rect x="1237" y="429" width="24" height="170"/>
    <rect x="1287" y="429" width="24" height="170"/>
    <rect x="1337" y="429" width="24" height="170"/>
    <path d="M1093 599h310v31h-310z"/>
  </g>

  <!-- agora amphitheater and plaza -->
  <g fill="none" stroke="#a69070" stroke-width="3" opacity=".58">
    <ellipse cx="800" cy="760" rx="560" ry="150"/>
    <ellipse cx="800" cy="760" rx="480" ry="122"/>
    <ellipse cx="800" cy="760" rx="400" ry="94"/>
    <ellipse cx="800" cy="760" rx="320" ry="67"/>
    <path d="M170 910H1430M220 875H1380M285 840H1315"/>
    <path d="M800 610V970M510 633L420 950M1090 633l90 317M330 680l-150 230M1270 680l150 230" opacity=".35"/>
  </g>

  <!-- statues and people silhouettes -->
  <g fill="#8f7b61" opacity=".46">
    <g transform="translate(190 660)"><circle cx="0" cy="0" r="9"/><path d="M-9 12h18l8 54h-34z"/></g>
    <g transform="translate(340 700) scale(.8)"><circle cx="0" cy="0" r="9"/><path d="M-9 12h18l8 54h-34z"/></g>
    <g transform="translate(1290 675) scale(.9)"><circle cx="0" cy="0" r="9"/><path d="M-9 12h18l8 54h-34z"/></g>
    <g transform="translate(1170 725) scale(.72)"><circle cx="0" cy="0" r="9"/><path d="M-9 12h18l8 54h-34z"/></g>
    <g transform="translate(690 835) scale(.62)"><circle cx="0" cy="0" r="9"/><path d="M-9 12h18l8 54h-34z"/></g>
    <g transform="translate(940 840) scale(.6)"><circle cx="0" cy="0" r="9"/><path d="M-9 12h18l8 54h-34z"/></g>
  </g>

  <!-- central light veil for readable content -->
  <rect x="390" y="0" width="820" height="1000" fill="#fffaf0" opacity=".19"/>
  <rect width="1600" height="1000" fill="#f6efe3" opacity=".07" filter="url(#paper)"/>
</svg>